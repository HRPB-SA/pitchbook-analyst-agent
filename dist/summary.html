<style>
/* CONTEXT: ANTHROPIC DECISION BOARD — one scrollable page for the person who has to decide: the call first, then the evidence under it.
   Layout: 12-column card grid, summary before detail; charts are hand-drawn SVG sized to their container.
   Tokens match the Intelligence Desk dashboard (stone paper, near-black ink, claret accent) so the two pages read as one product.
   Colour jobs: bull/bear = diverging blue/red with a grey midpoint (validated); status = fixed good/warning/critical; compute firmness = one-hue ordinal ramp (validated). */
:root {
  --bg: #F1F0EB; --surface: #FBFAF7; --surface-2: #F5F4EF; --surface-3: #ECEAE3;
  --ink: #15181E; --ink-2: #444B58; --muted: #5F6672; --line: #DEDBD2; --line-2: #CFCBC0;
  --accent: #8B2635; --on-accent: #FFFFFF;
  --grid: #E3E1DA; --axis: #BDBBB0;
  --bull: #2a78d6; --bear: #e34948; --mid: #8a8f99; --series-1: #2a78d6;
  --bull-rgb: 42, 120, 214; --bear-rgb: 227, 73, 72; --mid-rgb: 120, 118, 110;
  --za1: .13; --za2: .14; --za3: .10; --za4: .20;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #5598e7; --ord-4: #86b6ef;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #191C21; --surface-2: #1F2329; --surface-3: #262B32;
    --ink: #ECEAE4; --ink-2: #B9BDC6; --muted: #9299A5; --line: #2B3038; --line-2: #3A404A;
    --accent: #E07A88; --on-accent: #1A0B0E;
    --grid: #262A31; --axis: #3A404A;
    --bull: #3987e5; --bear: #e66767; --mid: #7d8490; --series-1: #3987e5;
    --bull-rgb: 57, 135, 229; --bear-rgb: 230, 103, 103; --mid-rgb: 146, 153, 165;
    --za1: .26; --za2: .22; --za3: .20; --za4: .36;
    --good-text: #4cc94c;
    --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #184f95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191C21; --surface-2: #1F2329; --surface-3: #262B32;
  --ink: #ECEAE4; --ink-2: #B9BDC6; --muted: #9299A5; --line: #2B3038; --line-2: #3A404A;
  --accent: #E07A88; --on-accent: #1A0B0E;
  --grid: #262A31; --axis: #3A404A;
  --bull: #3987e5; --bear: #e66767; --mid: #7d8490; --series-1: #3987e5;
  --bull-rgb: 57, 135, 229; --bear-rgb: 230, 103, 103; --mid-rgb: 146, 153, 165;
  --za1: .26; --za2: .22; --za3: .20; --za4: .36;
  --good-text: #4cc94c;
  --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #184f95;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.page { max-width: 1200px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 18px 40px; }
.masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; background: var(--surface); }
.pill i, .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); flex: none; }
.pill.good i { background: var(--good); } .pill.warn i { background: var(--warn); }
.lead { font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.22; letter-spacing: -.015em; max-width: 30em; text-wrap: balance; padding-block: 22px 18px; }
.lead .ct { font-weight: 700; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; text-decoration-color: var(--mid); }
.lead .ct.bull { text-decoration-color: var(--bull); } .lead .ct.bear { text-decoration-color: var(--bear); }
.lead-sub { font-size: 13px; color: var(--muted); max-width: 62em; margin-bottom: 16px; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.grid > * { min-width: 0; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 920px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 18px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.005em; }
.card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 60em; }
.tbtn { flex: none; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface-2); }
.tbtn:hover { border-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; max-width: 62em; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; border: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; }
.chip.call.bull i { background: var(--bull); } .chip.call.bear i { background: var(--bear); }
.tier { display: inline-block; padding: 0 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 10.5px; line-height: 17px; background: var(--surface-3); color: var(--ink); }
.tier.T1 { background: rgba(12,163,12,.16); } .tier.T2 { background: rgba(var(--bull-rgb), .16); } .tier.T3 { background: rgba(250,178,25,.22); } .tier.T4, .tier.T5 { background: rgba(var(--bear-rgb), .16); }

/* ---- the call at three prices ---- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 920px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tile-price { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.tile-line { font-size: 13px; color: var(--ink-2); }
.tile-line b { color: var(--ink); font-weight: 600; }
details.more { margin-top: 4px; font-size: 12.5px; }
details.more > summary { cursor: pointer; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-block; width: 14px; text-align: center; font-family: var(--font-mono); }
details.more[open] > summary::before { content: "−"; }
details.more > :not(summary) { margin-top: 6px; color: var(--ink-2); }
ul.ev { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
ul.ev li { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
ul.ev li a { color: var(--ink); }

/* ---- charts ---- */
.chartbox { width: 100%; min-width: 0; }
.chartbox svg { display: block; max-width: 100%; overflow: visible; }
.chartbox svg text { font-family: var(--font-body); }
.svg-t { font-size: 12px; font-weight: 600; fill: var(--ink); }
.svg-m { font-size: 11px; fill: var(--muted); }
.svg-cap { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hit { fill: transparent; pointer-events: all; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(128,128,128,.25); }
.legend .lk { width: 16px; height: 2px; border-radius: 1px; flex: none; }
.legend b { font-weight: 600; color: var(--ink); font-family: var(--font-mono); font-size: 11.5px; }

.tip { position: fixed; z-index: 50; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 6px 22px rgba(0,0,0,.22); }
.tip-t { font-weight: 600; margin-bottom: 3px; }
.tip-r { display: flex; align-items: center; gap: 7px; }
.tip-r i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip-r b { font-family: var(--font-mono); font-weight: 500; }
.tip-r span { opacity: .78; }
.tip-n { margin-top: 4px; opacity: .78; }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); white-space: nowrap; }
.scen td:first-child, .mx td:first-child { white-space: nowrap; }

@media (max-width: 520px) { .scen .hs { display: none; } .scen th { white-space: normal; } }
table.mx { table-layout: fixed; }
table.mx th, table.mx td { padding: 6px 8px; }
table.mx td.cell { border: 2px solid var(--surface); border-radius: 6px; }
table.mx td.cell .r { font-size: 18px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
@media (max-width: 520px) { table.mx td.cell .r { font-size: 15px; } table.mx th, table.mx td { padding: 6px 5px; } table.mx th:first-child { width: 23%; } }
table.mx td.cell .u { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
table.mx td.rowh { font-weight: 600; vertical-align: middle; }
table.mx td.rowh span { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
table.mx th:first-child { width: 26%; }

/* ---- stacked bars (2px surface gaps, 4px data-end) ---- */
.stack { display: flex; gap: 2px; height: 14px; }
.stack .seg { min-width: 3px; }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.meter-row + .meter-row { margin-top: 16px; }
.meter-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; margin-bottom: 6px; font-size: 13px; }
.meter-h b { font-weight: 600; }
.meter-h span { color: var(--muted); font-size: 12px; }

/* ---- scorecard ---- */
.srow { border-bottom: 1px solid var(--line); }
.srow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(90px, 1.1fr) minmax(100px, 1.3fr) 96px; gap: 10px; align-items: center; padding: 8px 0; }
.srow > summary::-webkit-details-marker { display: none; }
.srow .dim { font-size: 13px; }
.srow .dim::before { content: "+"; display: inline-block; width: 14px; font-family: var(--font-mono); color: var(--muted); }
.srow[open] .dim::before { content: "−"; }
.bars { display: grid; gap: 3px; }
.bars .b { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.bars .b i { display: block; height: 6px; border-radius: 0 3px 3px 0; }
.srow p { padding: 0 0 10px 14px; font-size: 12.5px; color: var(--ink-2); max-width: 60em; }
.edge { justify-self: end; }

/* ---- reasoning, flips ---- */
ol.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: w; }
ol.why > li { counter-increment: w; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 13.5px; color: var(--ink-2); max-width: 70ch; }
ol.why > li::before { content: counter(w); font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
ol.why > li > div > p { color: var(--ink); }
.evline { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.evline a { color: var(--ink); }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 36px; }
@media (max-width: 920px) { .two { grid-template-columns: minmax(0, 1fr); } }
ul.flips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.flips li { font-size: 13px; color: var(--ink); padding-left: 16px; position: relative; }
ul.flips li::before { content: "↳"; position: absolute; left: 0; color: var(--muted); }
.callout { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); display: grid; gap: 6px; }
.callout .t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.callout b { color: var(--ink); font-weight: 600; }
.sub-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

/* ---- facts ---- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 920px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.fact { padding: 12px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.fact-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.fact-h .fid { font-size: 11px; color: var(--muted); }
.fact-h h3 { font-size: 14px; font-weight: 600; }
.fact-h .basis { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.fact-v { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.fact-s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.fact-s a { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }

/* ---- misc ---- */
.cols { display: flex; align-items: flex-end; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12.5px; margin-top: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
ul.lim { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
ul.lim li { padding-left: 16px; position: relative; }
ul.lim li::before { content: "•"; position: absolute; left: 3px; color: var(--muted); }
.disc { display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
.disc b { color: var(--ink); font-weight: 600; }
.pass-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
.foot a { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const D = {"asof":"2026-09-30","built":"2026-10-01T21:51:09Z","commit":"9122142","verdict":{"call":"BEARISH","one_liner":"BEARISH at the reported $2T IPO target, which needs the bull case. NEUTRAL near $1.5T. LEAN BULLISH only at or below about $1.07T, which includes Series H at $965B.","horizon":"12-24 months after listing","rationale":["Reference class first, top-1,000 firms (1950-2015) with AWS and Nvidia data center: 19 of 4,472 five-year periods above $25B compounded real sales at 30% a year or more, and in the above-$50B class, where Anthropic's $55.8B FY2026 base sits, 1 of 1,810 did; the median gets most of the weight beyond three years and all three scenarios sit above it, so I weight it heavily for 2029-2030 growth and margins, lightly for 2026-2027, where H1 actuals are in hand.","At base margins every mark needs growth beyond that class: $262B, $420B and $568B of 2030 revenue (47%, 66% and 79% a year from FY2026), or $147B, $243B and $333B at bull margins, as both analysts compute; Series H passes only because delivering the $195B 2028 plan leaves 16% a year (model basis) or 11% (adjusted basis) for 2029-2030, against AWS's 13% to 20% in 2023-2025 and 37% in Q2 2026.","At $2T the price is 59% above the adjusted base of $1.26T (engine $1.19T, less 10.6% for SBC as a cost, plus 8.9% date roll and $100B net cash) and above every single-variable case; the bands (LEAN BULLISH to about $1.07T, NEUTRAL to $1.6T, LEAN BEARISH to $1.8T, BEARISH above) are a judgment from those cases, not odds, and NEUTRAL runs above the base because my base takes the lower margin reading, so favorable cases outrun adverse ones.","The base case follows the company plan, an inside-view anchor, but its $5B to $6B monthly adds sit below today's $7B, so I read it as central, not a cap; Series H is 23% below the adjusted base and matches FY2028 revenue 9% (model basis, training and capex held) to 18% (adjusted basis, scaled with revenue) under the plan, yet I stop at LEAN BULLISH because 2029-2030 growth 15 and 10 points lower takes 26% off value.","The cost side is fixed while revenue is not: about 80% of at least $518B of compute (8.0x the $65B run-rate) is non-cancelable, firm payments of about $53B in 2028 are 27% of plan revenue but 56% of the bear's, most large clients reportedly lack long-term contracts (one Reuters chain), two clouds carried 47% of FY2025 sales, two customers 12% each, and Opus list prices fell 73% in 14 months.","Information quality caps conviction: no public S-1, FY2024 revenue is implied, FY2025 is one readable Reuters review, no GAAP gross margin exists, and $559M was a May 20 projection; I use the Modeler's reading of $0.56 because held through H2 it implies a margin near 20% against a profit warning (WSJ via PYMNTS, T3), and the other reading adds 20% to 29% to base value, one notch.","Strongest argument for the side I reject: plans were beaten 2.1x for FY2025 and the 2028 plan rose 2.8x in nine months, $2T needs FY2028 revenue 26% (adjusted basis, training and capex held) to 42% (model basis, scaled) above the plan, and Nvidia data center grew +117% YoY in Q2 FY2027 and AWS +37% YoY in Q2 2026 (T1 releases, fetched, outside the record); but both sell into the same build-out, so they test the cycle, not Anthropic."],"rationale_events":[[{"id":"evt-20260929-q1-2026-rev-4-73b-q2-11-5b-prospectus","date":"2026-09-29","headline":"Prospectus snapshot: Q1 2026 revenue $4.73B, Q2 2026 revenue $11.5B","publisher":"Fortune","tier":"T2","url":"https://fortune.com/2026/09/29/anthropic-ipo-s-1-prospectus-income-statement/"},{"id":"evt-20260814-q2-2026-rev-11-5b-first-report","date":"2026-08-14","headline":"Anthropic Q2 2026 revenue reported above $11.5B, 14x year earlier (Bloomberg/CNBC)","publisher":"Proactive Investors (via Yahoo Finance), summarizing Bloomberg","tier":"T3","url":"https://finance.yahoo.com/technology/ai/articles/anthropic-file-ipo-could-top-063500275.html"}],[{"id":"evt-20260528-series-h-compute-agreements-me 026 platform fees above 15% of revenue (each 5 points cuts base value about 15%), net retention under 100%, or fewer than 1,000 customers above $1M: every mark moves one notch down.","A contractual-obligations table showing a non-cancelable share under 60% or 2027 payments under $45B: the fixed-cost argument shrinks and every mark moves one notch up.","A roadshow range implying about $1.07T or less moves the IPO call to LEAN BULLISH; a listing at $1.8T or more that still trades above the offer 90 days later and after the first lock-up release shows the bearish leg was wrong.","Claude removed as Cursor's default after the SpaceX close, or a SpaceX notice on Colossus after the 180-day mark near Oct 30: coding share was rented, and Series H moves to NEUTRAL."],"what_flips_events":[[{"id":"evt-20260929-q1-2026-rev-4-73b-q2-11-5b-prospectus","date":"2026-09-29","headline":"Prospectus snapshot: Q1 2026 revenue $4.73B, Q2 2026 revenue $11.5B","publisher":"Fortune","tier":"T2","url":"https://fortune.com/2026/09/29/anthropic-ipo-s-1-prospectus-income-statement/"},{"id":"evt-20260918-wsj-ipo-pushed-to-november","date":"2026-09-18","headline":"WSJ: Anthropic pushes IPO to November, after Q3 results","publisher":"Investing.com (via Yahoo Finance), citing The Wall Street Journal","tier":"T3","url":"https://finance.yahoo.com/technology/ai/articles/anthropic-delays-ipo-staging-november-221039905.html"},{"id":"evt-20260913-ft-adj-op-profit-gm-above-80pct","date":"2026-09-13","headline":"FT: second straight adjusted operating profit; gross margin above 80% (adjusted)","publisher":"Stocktwits (via Yahoo Finance), citing Financial Times","tier":"T3","url":"https://finance.yahoo.com/technology/ai/articles/anthropic-ipo-claude-maker-reportedly-070605263.html"}],[{"id":"evt-20260817-rr-65b-end-july","date":"2026-08-17","headline":"Anthropic annualized revenue run-rate surpasses $65B at end of July (Bloomberg)","publisher":"TechCrunch (citing Bloomberg)","tier":"T2","url":"https://techcru g and Sabrina Valle)","tier":"T2","url":"https://www.ksl.com/article/51629885/anthropics-518-billion-ai-buildout-hinges-largely-on-deals-that-cannot-be-canceled-filing-shows"},{"id":"evt-20260928-reuters-draft-prospectus-2025-financials","date":"2026-09-28","headline":"Reuters: draft prospectus shows $42B 2025 net loss, $518B spending plans","publisher":"Reuters (via Yahoo Finance, Echo Wang)","tier":"T2","url":"https://finance.yahoo.com/technology/ai/articles/exclusive-anthropics-ipo-prospectus-shows-231722972.html"}],[{"id":"evt-20260918-wsj-ipo-pushed-to-november","date":"2026-09-18","headline":"WSJ: Anthropic pushes IPO to November, after Q3 results","publisher":"Investing.com (via Yahoo Finance), citing The Wall Street Journal","tier":"T3","url":"https://finance.yahoo.com/technology/ai/articles/anthropic-delays-ipo-staging-november-221039905.html"},{"id":"evt-20260817-secondary-up-to-1-5t-perps-imply-1-8t","date":"2026-08-17","headline":"Secondary trades reported up to $1.5T; pre-IPO perpetuals imply $1.8T","publisher":"CCN (via Yahoo Finance, Guneet Kaur)","tier":"T4","url":"https://finance.yahoo.com/markets/crypto/articles/anthropic-tokenized-price-implies-1-150342277.html"},{"id":"evt-20260827-information-prospectus-after-labor-day-insider-sales","date":"2026-08-27","headline":"The Information: prospectus after Labor Day; insiders may sell; longer lockups","publisher":"BeInCrypto (via Yahoo Finance, Lockridge Okoth), citing The Information","tier":"T4","url":"https://finance.yahoo.com/technology/ai/articles/anthropic-ipo-could-come-september-191409974.html"}],[{"id":"evt-20260616-spacex-cursor","date":"2026-06-16","headline":"SpaceX agrees to buy Cursor (Anysphere) for $60B","publisher":"SEC EDGAR (SpaceX 8-K)","tier":"T1","url":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026043411/spaceexplorationtechnologi.htm"},{"id":"evt-20260528-spacex-lease-length-dispute","date":"2026-05-28","headline":"Musk says SpaceX only committed to 180 days on Colossus","publisher":"TechCrunch","tier":"T2","url":"https://techcrunch.com/2026/05/28/how-long-is-anthropics-lease-with-spacex-opinions-vary/"},{"id":"evt-20260520-spacex-s1-anthropic-colossus-contract","date":"2026-05-20","headline":"SpaceX S-1: Anthropic pays $1.25B/month through May 2029","publisher":"SEC EDGAR - SpaceX CORRESP letter (Jun 1 2026)","tier":"T1","url":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026039278/filename1.htm"}]],"unresolved":["Scope of the $0.56 Q2 compute ratio (VERIFY): inference only (Modeler, 2026 gross margin 48%) or all compute including training (Compute Economist, 73%, range 56% to 83%). The record splits: the WSJ event reads it as all-in, the PitchBook event as a serving subset. The S-1 cost-of-revenue line settles it.","Every FY2024 and FY2025 figure comes from press reads of a leaked draft (Reuters readable, FT unreadable) with no public S-1; FY2024 revenue of $386M is implied from +1,088%. H1 2026 comes from investor documents and the same draft, Q1 of $4.73B via Fortune citing CNBC (T3). These anchor margins and costs, not the revenue path, and the Modeler's tie-out to the FY2025 loss is an identity.","The 39.75% haircut is an open methodology conflict: fitted to the marks, against 7.6% in the record (one Reuters chain, T3) and PitchBook's 6% to 10% (T3). A fee ratio near 39.75% in the S-1 would be the first evidence for it and would move the DCF, not only the multiples.","IPO terms are DISPUTED: raise up to $100B (WSJ, T3) against at least $130B (The Information, T4); October against November; lock-up, insider sales and Amazon's nonvoting cap are unreported. The $2T figure itself is reported, not confirmed.","Compute lines are partly DISPUTED or VERIFY: Google $111.1B against about $200B over five years; SpaceX $45B nominal against up to $84.5B and a 90-day against 180-day firm period; $34.5B of lessor notes; whether $144.8B of named neocloud deals sits inside the $518B; no schedule by year.","Q2 adjusted operating income has no dollar amount or definition (VERIFY). The $559M was the May 20 projection on $10.9B, and a T4 relay printed it as a result. A claims-ledger row records one source attributing about $559M of adjusted profit to the FT; no opened source does. The FT's above 80% gross margin is single origin.","Retention and contract terms are not disclosed: net retention of 140% or more is an untraceable PitchBook estimate (VERIFY), and most large clients reportedly lack long-term contracts (Reuters, T3). The two 12% customers and the 47% channel share are FY2025 figures for a run-rate that has grown 7x since.","Net cash after Dec 31, 2025 is not in the record; the +$100B is a Modeler estimate from Series G, Series H and $20.28B of year-end cash. The $15B pre-IPO revolver and $34.5B of lessor notes are not counted. Primary IPO proceeds of $100B to $130B, if any, would add to value.","Reference-class limits: the Base Rate Book is one T3 source (1950-2015, real sales, survivors only); I confirmed its counts at source, which checks transcription, not independence. The record holds no base rate for take-or-pay capacity buyers or for mega-IPO pricing against the last private mark, and Nvidia and AWS are counterparties to Anthropic's commitments.","The $190B to $200B 2028 plan is two unnamed sources (Reuters, Aug 17, T2) with basis unstated, and the 2028 plan was $70B in Nov 2025. The FT's roughly $360B run-rate at end-2027 (LOW) is 1.8x the plan. The base follows the plan, so its 2027-2028 path is an inside-view anchor, and plans differ by audience.","OpenAI comparables: run-rate of $40B (Bloomberg, Aug) against nearly $70B (Axios, Sep, basis unstated) puts its $852B mark at 21.3x or 12.2x, so relative value cannot carry the call under either haircut."]},"marks":[{"key":"series_h","label":"Series H post-money (May 2026)","ev_usd_m":965000,"call":"LEAN BULLISH","why":"Needs $262B of 2030 revenue (47% a year, inside the 0.0% bin), but this case differs: $16.2B of H1 revenue a   const G = { PASS: 'var(--good)', WARN: 'var(--warn)', FAIL: 'var(--critical)' };
  const row = (title, right, bar, lg, text) => el('div', { class: 'meter-row' }, el('div', { class: 'meter-h' }, el('b', { text: title }), el('span', { text: right })), bar, lg, text ? el('p', { class: 'note', text }) : null);
  const g11 = g.items.find(x => x.status === 'WARN');
  const gates = row('Ship gates', `${g.items.length} mechanical checks`, stackBar(['PASS', 'WARN', 'FAIL'].map(s => ({ n: g.summary[s], color: G[s], label: s })), g.items.length, 'Ship gate results'),
    legend([{ color: G.PASS, label: '✓ Pass', n: g.summary.PASS }, { color: G.WARN, label: '! Warn', n: g.summary.WARN }, { color: G.FAIL, label: '✕ Fail', n: g.summary.FAIL }]),
    g11 ? `${g11.id} warns: ${g11.detail}.` : null);
  const av = a.verdicts, opened = a.n - (av.UNOPENABLE || 0);
  const audit = row('Cold audit of a random sample', `${a.n} events, source pages re-opened`, stackBar([{ n: av.SUPPORTED, color: 'var(--good)', label: 'Fully supported' }, { n: av.PARTLY, color: 'var(--warn)', label: 'Core fact supported, a detail not' }, { n: av.UNOPENABLE || 0, color: 'var(--mid)', label: 'Page could not be opened' }].filter(x => x.n), a.n, 'Audit results'),
    legend([{ color: 'var(--good)', label: '✓ Fully supported', n: av.SUPPORTED }, { color: 'var(--warn)', label: '! Partly supported', n: av.PARTLY }, { color: 'var(--mid)', label: '? Unopenable', n: av.UNOPENABLE || 0 }]),
    `The core fact was supported in ${Math.round(a.supported_or_partly_share * 100)}% of the ${opened} events that could be opened; ${Math.round(a.supported_share * 100)}% were fully supported. ${a.corrections} audit-driven corrections were applied and logged.`);
  const cs = cl.summary;
  const claims = row('Load-bearing claims re-derived blind', `${cl.n} claims, four agents that never saw the draft`, stackBar([
    { n: cs.MATCH, color: 'var(--good)', label: 'Match' }, { n: cs.NOTED, color: 'var(--mid)', label: 'Noted: text compared side by side' }, { n: cs.PARTIAL, color: 'var(--warn)', label: 'Partial' },
    { n: cs.MISMATCH, color: 'var(--critical)', label: 'Mismatch, frozen' }, { n: cs.UNTRACEABLE, color: 'var(--ink-2)', label: 'Untraceable' }], cl.n, 'Claim reconciliation'),
    legend([{ color: 'var(--good)', label: '✓ Match', n: cs.MATCH }, { color: 'var(--mid)', label: '≈ Noted', n: cs.NOTED }, { color: 'var(--warn)', label: '! Partial', n: cs.PARTIAL }, { color: 'var(--critical)', label: '✕ Mismatch', n: cs.MISMATCH }, { color: 'var(--ink-2)', label: '? Untraceable', n: cs.UNTRACEABLE }]),
    `Mismatches are frozen with both values shown, never resolved by the desk (see below).`);
  const passes = el('div', { class: 'pass-list' }, c.passes.map((p, i) => el('span', { class: 'chip', title: p.blocking ? `Blocking: ${p.blocking}` : '' }, el('i', { style: `background:${p.verdict === 'READY' ? 'var(--good)' : 'var(--critical)'}` }), `Pass ${i + 1} · ${p.head} · ${p.verdict}`)));
  const cert = el('div', { class: 'meter-row' }, el('div', { class: 'meter-h' }, el('b', { text: 'Independent Certifier' }), el('span', { text: `default verdict NEEDS WORK; ${c.verdict} on pass ${c.passes.length}` })), passes,
    el('p', { class: 'note', text: `Re-derived ${c.facts_total} load-bearing facts before opening any deliverable: ${c.facts_agree} of ${c.facts_total} agree. Recomputed ${c.recomputed_total} model and verdict figures: ${c.recomputed_ok} within tolerance (the miss was an earlier draft sentence the Judge then rewrote). ${c.blocking} blocking and ${c.non_blocking} non-blocking notes at ${c.certified_commit}. ${c.later_commits.length} commit${c.later_commits.length === 1 ? '' : 's'} since then were smoke-tested in a browser only, not re-certified.` }),
    c.later_commits.length ? el('details', { class: 'more' }, el('summary', { text: 'Commits since certification' }), el('ul', { class: 'flips' }, c.later_commits.map(x => el('li', {}, el('span', { class: 'mono', text: `${x.sha} ` }), x.subject)))) : null,
    null);
  return card('c7', 'How far to trust it', 'Four independent layers, each run by agents that did not write the draft.', el('div', {}, gates, audit, claims, cert));
}

/* ------------------------------------------------------------------ compute */
function computeCard() {
  const k = D.compute, cols = ['var(--ord-1)', 'var(--ord-2)', 'var(--ord-3)', 'var(--ord-4)'];
  const parts = k.segments.map((s, i) => ({ n: s.usd_m, valText: fmt.usdM(s.usd_m, 1), color: cols[i], label: s.label, note: `${fmt.pct(s.usd_m / k.announced_usd_m, 0)} of announced` }));
  const bar = stackBar(parts, fmt.usdM(k.announced_usd_m, 1), 'Compute commitments by how firm they are');
  const lg = legend(k.segments.map((s, i) => ({ color: cols[i], label: s.label, n: fmt.usdM(s.usd_m, 1) })));
  const table = () => simpleTable(['Basis', 'Amount', 'Share'], k.segments.map(s => [s.label, fmt.usdM(s.usd_m, 1), fmt.pct(s.usd_m / k.announced_usd_m, 1)]).concat([['Announced total', fmt.usdM(k.announced_usd_m, 1), '100%']]), [1, 2]);
  const body = el('div', {}, el('div', { style: 'font-size:13px;margin-bottom:8px' }, el('b', { style: 'font-size:26px;font-weight:600;letter-spacing:-.02em', text: fmt.usdM(k.announced_usd_m, 1) }), ' announced across ', `${k.commitments} commitments`),
    bar, lg,
    el('dl', { class: 'kv' }, el('dt', { text: 'Contracted or disclosed' }), el('dd', { text: fmt.usdM(k.contracted_usd_m, 1) }), el('dt', { text: 'Capacity announced' }), el('dd', { text: `${k.gw_announced} GW, of which ${k.gw_up_to_ceiling} GW are “up to” ceilings` }),
      el('dt', { text: 'Leaked draft prospectus' }), el('dd', { text: `${fmt.usdM(k.s1_reference_usd_m, 1)}, ${fmt.pct(k.s1_non_cancelable_share, 1)} non-cancelable` })),
    el('p', { class: 'note', text: '“Up to” is not contracted, announced is not closed, and the prospectus figures are press-reported from a leaked draft (Reuters), not from a public filing.' }));
  return card('', 'Compute commitments by firmness', 'Darkest is firmest. The segments sum to the announced total.', body, table);
}

/* ------------------------------------------------------------------ facts */

  const items = D.facts.map(f => el('article', { class: 'fact' },
    el('div', { class: 'fact-h' }, el('span', { class: 'fid', text: f.id }), el('h3', { text: f.label }), el('span', { class: 'basis', text: f.basis })),
    el('p', { class: 'fact-v', text: f.headline }),
    el('div', { class: 'fact-s' }, el('span', { text: `as of ${f.as_of}` }), f.single_source ? el('span', { text: 'single source' }) : null, f.sources.map(s => ext(s.url, s.publisher || s.url, '')).map((a, i) => el('span', { style: 'display:inline-flex;gap:5px;align-items:center' }, tierChip(f.sources[i].tier), a))),
    el('details', { class: 'more' }, el('summary', { text: 'Certifier’s full text' }), el('p', { text: f.full }))));
  return card('c12', 'Load-bearing facts, re-derived from source', 'The Certifier researched each one itself before it opened any deliverable, then compared. All eight agree with the dashboard.', el('div', { class: 'facts' }, items));
}

/* ------------------------------------------------------------------ frozen conflicts */
const FIELD = { date: 'Date', size_usd_m: 'Round size, $M', pre_usd_m: 'Pre-money, $M', post_usd_m: 'Post-money, $M', equity_only_usd_m: 'Equity raised, $M', debt_usd_m: 'Debt, $M', total_usd_m: 'Total, $M', run_rate_usd_m: 'Run-rate, $M' };
function mismatchCard() {
  const rows = D.mismatches.map(m => [el('b', { style: 'font-weight:600', text: m.claim }), el('div', {}, m.compared.map(c => el('div', { class: 'small' }, el('span', { class: 'muted', text: `${FIELD[c.field] || c.field}: ` }), c.detail))), el('div', {}, m.sources.map(u => el('div', { class: 'small' }, ext(u, new URL(u).hostname.replace(/^www\./, '')))))]);
  return card('c12', 'Frozen conflicts', `${D.mismatches.length} figures where the draft record and the blind re-derivation disagree beyond tolerance. Neither is adopted; both are shown.`, el('div', { class: 'tablewrap' }, simpleTable(['Claim in the record', 'Where they differ (record vs re-derivation)', 'Re-derivation sources'], rows)));
}

/* ------------------------------------------------------------------ the record, limits, disclosures */
function recordCard() {
  const r = D.record, box = el('div', { class: 'chartbox' }), yrs = Object.keys(r.by_year), max = Math.max(...Object.values(r.by_year));
  const draw = W => {
    box.replaceChildren();
    const H = 150, m = { t: 20, r: 6, b: 22, l: 6 }, iw = W - m.l - m.r, ih = H - m.t - m.b, slot = iw / yrs.length, bw = Math.min(24, slot - 8);
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Events per year: ${yrs.map(y => `${y} ${r.by_year[y]}`).join(', ')}` });
    svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: 'var(--axis)', 'stroke-width': 1 }));
    yrs.forEach((y, i) => {
      const v = r.by_year[y], h = Math.max(2, ih * v / max), x = m.l + slot * i + (slot - bw) / 2, g = sv('g', { tabindex: '0', 'aria-label': `${y}: ${v} events` });
      g.append(sv('path', { d: `M${x},${m.t + ih} V${m.t + ih - h + 4} Q${x},${m.t + ih - h} ${x + 4},${m.t + ih - h} H${x + bw - 4} Q${x + bw},${m.t + ih - h} ${x + bw},${m.t + ih - h + 4} V${m.t + ih} Z`, fill: 'var(--series-1)' }));
      g.append(sv('text', { class: 'svg-t', x: x + bw / 2, y: m.t + ih - h - 6, 'text-anchor': 'middle', text: String(v) }));
      g.append(sv('text', { class: 'svg-m', x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', text: y }));
      g.append(sv('rect', { class: 'hit', x: m.l + slot * i, y: m.t, width: slot, height: ih }));
      bindTip(g, () => ({ title: y, rows: [{ key: 'dated events', val: String(v), color: 'var(--series-1)' }] }));
      svg.append(g);
    });
    box.append(svg);
  };
  const tierText = Object.entries(r.by_tier).map(([k, v]) => `${k} ${v}`).join(' · '), conf = Object.entries(r.by_confidence).map(([k, v]) => `${k} ${v}`).join(' · ');
  const body = el('div', {}, box, el('dl', { class: 'kv' }, el('dt', { text: 'Source tier' }), el('dd', { text: tierText }), el('dt', { text: 'Confidence' }), el('dd', { text: conf }), el('dt', { text: 'Built by' }), el('dd', { text: `${r.agents} agents, ${r.logged_actions.toLocaleString('en-US')} logged actions` })),
    el('p', { class: 'note', text: `${r.raw_findings.toLocaleString('en-US')} raw findings were deduplicated into ${r.events} dated events (${r.first} to ${r.last}) and ${r.entities} entities. Coverage is thickest in the last two years.` }));
  const table = () => simpleTable(['Year', 'Dated events'], yrs.map(y => [y, String(r.by_year[y])]), [1]);
  const c = card('', 'The record', 'Dated events by year, each with a one-sentence summary, a source and a tier.', body, table);
  observe(box, draw);
  return c;
}

}
