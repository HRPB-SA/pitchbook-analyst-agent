<title>Anthropic Decision Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* CONTEXT: ANTHROPIC DECISION BOARD — one scrollable page for the person who has to decide: the call first, then the evidence under it.
   Layout: 12-column card grid, summary before detail; charts are hand-drawn SVG sized to their container.
   Tokens match the Intelligence Desk dashboard (stone paper, near-black ink, claret accent) so the two pages read as one product.
   Colour jobs: bull/bear = diverging blue/red with a grey midpoint (validated); status = fixed good/warning/critical; compute firmness = one-hue ordinal ramp (validated). */
:root {
  --bg: #F1F0EB; --surface: #FBFAF7; --surface-2: #F5F4EF; --surface-3: #ECEAE3;
  --ink: #15181E; --ink-2: #444B58; --muted: #5F6672; --line: #DEDBD2; --line-2: #CFCBC0;
  --accent: #8B2635; --on-accent: #FFFFFF;
  --grid: #E3E1DA; --axis: #BDBBB0;
  --bull: #2a78d6; --bear: #e34948; --mid: #8a8f99; --series-1: #2a78d6;
  --bull-rgb: 42, 120, 214; --bear-rgb: 227, 73, 72; --mid-rgb: 120, 118, 110;
  --za1: .13; --za2: .14; --za3: .10; --za4: .20;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #5598e7; --ord-4: #86b6ef;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #191C21; --surface-2: #1F2329; --surface-3: #262B32;
    --ink: #ECEAE4; --ink-2: #B9BDC6; --muted: #9299A5; --line: #2B3038; --line-2: #3A404A;
    --accent: #E07A88; --on-accent: #1A0B0E;
    --grid: #262A31; --axis: #3A404A;
    --bull: #3987e5; --bear: #e66767; --mid: #7d8490; --series-1: #3987e5;
    --bull-rgb: 57, 135, 229; --bear-rgb: 230, 103, 103; --mid-rgb: 146, 153, 165;
    --za1: .26; --za2: .22; --za3: .20; --za4: .36;
    --good-text: #4cc94c;
    --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #184f95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191C21; --surface-2: #1F2329; --surface-3: #262B32;
  --ink: #ECEAE4; --ink-2: #B9BDC6; --muted: #9299A5; --line: #2B3038; --line-2: #3A404A;
  --accent: #E07A88; --on-accent: #1A0B0E;
  --grid: #262A31; --axis: #3A404A;
  --bull: #3987e5; --bear: #e66767; --mid: #7d8490; --series-1: #3987e5;
  --bull-rgb: 57, 135, 229; --bear-rgb: 230, 103, 103; --mid-rgb: 146, 153, 165;
  --za1: .26; --za2: .22; --za3: .20; --za4: .36;
  --good-text: #4cc94c;
  --ord-1: #86b6ef; --ord-2: #5598e7; --ord-3: #2a78d6; --ord-4: #184f95;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.page { max-width: 1200px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 18px 40px; }
.masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; background: var(--surface); }
.pill i, .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); flex: none; }
.pill.good i { background: var(--good); } .pill.warn i { background: var(--warn); }
.lead { font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.22; letter-spacing: -.015em; max-width: 30em; text-wrap: balance; padding-block: 22px 18px; }
.lead .ct { font-weight: 700; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; text-decoration-color: var(--mid); }
.lead .ct.bull { text-decoration-color: var(--bull); } .lead .ct.bear { text-decoration-color: var(--bear); }
.lead-sub { font-size: 13px; color: var(--muted); max-width: 62em; margin-bottom: 16px; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.grid > * { min-width: 0; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 920px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 18px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.005em; }
.card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 60em; }
.tbtn { flex: none; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface-2); }
.tbtn:hover { border-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; max-width: 62em; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; border: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; }
.chip.call.bull i { background: var(--bull); } .chip.call.bear i { background: var(--bear); }
.tier { display: inline-block; padding: 0 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 10.5px; line-height: 17px; background: var(--surface-3); color: var(--ink); }
.tier.T1 { background: rgba(12,163,12,.16); } .tier.T2 { background: rgba(var(--bull-rgb), .16); } .tier.T3 { background: rgba(250,178,25,.22); } .tier.T4, .tier.T5 { background: rgba(var(--bear-rgb), .16); }

/* ---- the call at three prices ---- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 920px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tile-price { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.tile-line { font-size: 13px; color: var(--ink-2); }
.tile-line b { color: var(--ink); font-weight: 600; }
details.more { margin-top: 4px; font-size: 12.5px; }
details.more > summary { cursor: pointer; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-block; width: 14px; text-align: center; font-family: var(--font-mono); }
details.more[open] > summary::before { content: "−"; }
details.more > :not(summary) { margin-top: 6px; color: var(--ink-2); }
ul.ev { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
ul.ev li { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
ul.ev li a { color: var(--ink); }

/* ---- charts ---- */
.chartbox { width: 100%; min-width: 0; }
.chartbox svg { display: block; max-width: 100%; overflow: visible; }
.chartbox svg text { font-family: var(--font-body); }
.svg-t { font-size: 12px; font-weight: 600; fill: var(--ink); }
.svg-m { font-size: 11px; fill: var(--muted); }
.svg-cap { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hit { fill: transparent; pointer-events: all; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(128,128,128,.25); }
.legend .lk { width: 16px; height: 2px; border-radius: 1px; flex: none; }
.legend b { font-weight: 600; color: var(--ink); font-family: var(--font-mono); font-size: 11.5px; }

.tip { position: fixed; z-index: 50; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 6px 22px rgba(0,0,0,.22); }
.tip-t { font-weight: 600; margin-bottom: 3px; }
.tip-r { display: flex; align-items: center; gap: 7px; }
.tip-r i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip-r b { font-family: var(--font-mono); font-weight: 500; }
.tip-r span { opacity: .78; }
.tip-n { margin-top: 4px; opacity: .78; }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); white-space: nowrap; }
.scen td:first-child, .mx td:first-child { white-space: nowrap; }

@media (max-width: 520px) { .scen .hs { display: none; } .scen th { white-space: normal; } }
table.mx { table-layout: fixed; }
table.mx th, table.mx td { padding: 6px 8px; }
table.mx td.cell { border: 2px solid var(--surface); border-radius: 6px; }
table.mx td.cell .r { font-size: 18px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
@media (max-width: 520px) { table.mx td.cell .r { font-size: 15px; } table.mx th, table.mx td { padding: 6px 5px; } table.mx th:first-child { width: 23%; } }
table.mx td.cell .u { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
table.mx td.rowh { font-weight: 600; vertical-align: middle; }
table.mx td.rowh span { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
table.mx th:first-child { width: 26%; }

/* ---- stacked bars (2px surface gaps, 4px data-end) ---- */
.stack { display: flex; gap: 2px; height: 14px; }
.stack .seg { min-width: 3px; }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.meter-row + .meter-row { margin-top: 16px; }
.meter-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; margin-bottom: 6px; font-size: 13px; }
.meter-h b { font-weight: 600; }
.meter-h span { color: var(--muted); font-size: 12px; }

/* ---- scorecard ---- */
.srow { border-bottom: 1px solid var(--line); }
.srow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(90px, 1.1fr) minmax(100px, 1.3fr) 96px; gap: 10px; align-items: center; padding: 8px 0; }
.srow > summary::-webkit-details-marker { display: none; }
.srow .dim { font-size: 13px; }
.srow .dim::before { content: "+"; display: inline-block; width: 14px; font-family: var(--font-mono); color: var(--muted); }
.srow[open] .dim::before { content: "−"; }
.bars { display: grid; gap: 3px; }
.bars .b { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.bars .b i { display: block; height: 6px; border-radius: 0 3px 3px 0; }
.srow p { padding: 0 0 10px 14px; font-size: 12.5px; color: var(--ink-2); max-width: 60em; }
.edge { justify-self: end; }

/* ---- reasoning, flips ---- */
ol.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: w; }
ol.why > li { counter-increment: w; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 13.5px; color: var(--ink-2); max-width: 70ch; }
ol.why > li::before { content: counter(w); font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
ol.why > li > div > p { color: var(--ink); }
.evline { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.evline a { color: var(--ink); }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 36px; }
@media (max-width: 920px) { .two { grid-template-columns: minmax(0, 1fr); } }
ul.flips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.flips li { font-size: 13px; color: var(--ink); padding-left: 16px; position: relative; }
ul.flips li::before { content: "↳"; position: absolute; left: 0; color: var(--muted); }
.callout { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); display: grid; gap: 6px; }
.callout .t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.callout b { color: var(--ink); font-weight: 600; }
.sub-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }

/* ---- facts ---- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 920px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.fact { padding: 12px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.fact-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.fact-h .fid { font-size: 11px; color: var(--muted); }
.fact-h h3 { font-size: 14px; font-weight: 600; }
.fact-h .basis { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.fact-v { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.fact-s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.fact-s a { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }

/* ---- misc ---- */
.cols { display: flex; align-items: flex-end; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12.5px; margin-top: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
ul.lim { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
ul.lim li { padding-left: 16px; position: relative; }
ul.lim li::before { content: "•"; position: absolute; left: 3px; color: var(--muted); }
.disc { display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
.disc b { color: var(--ink); font-weight: 600; }
.pass-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
.foot a { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div class="page" id="app"></div>

/* ------------------------------------------------------------------ how far to trust it */

    legend([{ color: 'var(--good)', label: '✓ Fully supported', n: av.SUPPORTED }, { color: 'var(--warn)', label: '! Partly supported', n: av.PARTLY }, { color: 'var(--mid)', label: '? Unopenable', n: av.UNOPENABLE || 0 }]),
    `The core fact was supported in ${Math.round(a.supported_or_partly_share * 100)}% of the ${opened} events that could be opened; ${Math.round(a.supported_share * 100)}% were fully supported. ${a.corrections} audit-driven corrections were applied and logged.`);
  const cs = cl.summary;

    { n: cs.MATCH, color: 'var(--good)', label: 'Match' }, { n: cs.NOTED, color: 'var(--mid)', label: 'Noted: text compared side by side' }, { n: cs.PARTIAL, color: 'var(--warn)', label: 'Partial' },

    legend([{ color: 'var(--good)', label: '✓ Match', n: cs.MATCH }, { color: 'var(--mid)', label: '≈ Noted', n: cs.NOTED }, { color: 'var(--warn)', label: '! Partial', n: cs.PARTIAL }, { color: 'var(--critical)', label: '✕ Mismatch', n: cs.MISMATCH }, { color: 'var(--ink-2)', label: '? Untraceable', n: cs.UNTRACEABLE }]),

  const cert = el('div', { class: 'meter-row' }, el('div', { class: 'meter-h' }, el('b', { text: 'Independent Certifier' }), el('span', { text: `default verdict NEEDS WORK; ${c.verdict} on pass ${c.passes.length}` })), passes,
    el('p', { class: 'note', text: `Re-derived ${c.facts_total} load-bearing facts before opening any deliverable: ${c.facts_agree} of ${c.facts_total} agree. Recomputed ${c.recomputed_total} model and verdict figures: ${c.recomputed_ok} within tolerance (the miss was an earlier draft sentence the Judge then rewrote). ${c.blocking} blocking and ${c.non_blocking} non-blocking notes at ${c.certified_commit}. ${c.later_commits.length} commit${c.later_commits.length === 1 ? '' : 's'} since then were smoke-tested in a browser only, not re-certified.` }),

    null);
  return card('c7', 'How far to trust it', 'Four independent layers, each run by agents that did not write the draft.', el('div', {}, gates, audit, claims, cert));

/* ------------------------------------------------------------------ compute */
function computeCard() {

/* ------------------------------------------------------------------ the record, limits, disclosures */
function recordCard() {
  const r = D.record, box = el('div', { class: 'chartbox' }), yrs = Object.keys(r.by_year), max = Math.max(...Object.values(r.by_year));
  const draw = W => {
    box.replaceChildren();
    const H = 150, m = { t: 20, r: 6, b: 22, l: 6 }, iw = W - m.l - m.r, ih = H - m.t - m.b, slot = iw / yrs.length, bw = Math.min(24, slot - 8);
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Events per year: ${yrs.map(y => `${y} ${r.by_year[y]}`).join(', ')}` });
    svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: 'var(--axis)', 'stroke-width': 1 }));
    yrs.forEach((y, i) => {
      const v = r.by_year[y], h = Math.max(2, ih * v / max), x = m.l + slot * i + (slot - bw) / 2, g = sv('g', { tabindex: '0', 'aria-label': `${y}: ${v} events` });
      g.append(sv('path', { d: `M${x},${m.t + ih} V${m.t + ih - h + 4} Q${x},${m.t + ih - h} ${x + 4},${m.t + ih - h} H${x + bw - 4} Q${x + bw},${m.t + ih - h} ${x + bw},${m.t + ih - h + 4} V${m.t + ih} Z`, fill: 'var(--series-1)' }));
      g.append(sv('text', { class: 'svg-t', x: x + bw / 2, y: m.t + ih - h - 6, 'text-anchor': 'middle', text: String(v) }));
      g.append(sv('text', { class: 'svg-m', x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', text: y }));
      g.append(sv('rect', { class: 'hit', x: m.l + slot * i, y: m.t, width: slot, height: ih }));
      bindTip(g, () => ({ title: y, rows: [{ key: 'dated events', val: String(v), color: 'var(--series-1)' }] }));
      svg.append(g);
    });
    box.append(svg);
  };
  const tierText = Object.entries(r.by_tier).map(([k, v]) => `${k} ${v}`).join(' · '), conf = Object.entries(r.by_confidence).map(([k, v]) => `${k} ${v}`).join(' · ');
  const body = el('div', {}, box, el('dl', { class: 'kv' }, el('dt', { text: 'Source tier' }), el('dd', { text: tierText }), el('dt', { text: 'Confidence' }), el('dd', { text: conf }), el('dt', { text: 'Built by' }), el('dd', { text: `${r.agents} agents, ${r.logged_actions.toLocaleString('en-US')} logged actions` })),
    el('p', { class: 'note', text: `${r.raw_findings.toLocaleString('en-US')} raw findings were deduplicated into ${r.events} dated events (${r.first} to ${r.last}) and ${r.entities} entities. Coverage is thickest in the last two years.` }));
  const table = () => simpleTable(['Year', 'Dated events'], yrs.map(y => [y, String(r.by_year[y])]), [1]);
  const c = card('', 'The record', 'Dated events by year, each with a one-sentence summary, a source and a tier.', body, table);
  observe(box, draw);
  return c;
}

    'The model’s canonical 39.75% revenue-basis haircut is fitted to two valuation marks and has no public source. The record’s own evidence is about 7.6% (platform fees) and 6% to 10% (PitchBook); both are offered in the dashboard’s Model tab and neither is chosen.',

}
